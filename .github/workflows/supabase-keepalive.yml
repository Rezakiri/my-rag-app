name: Keep Supabase alive

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Ping Supabase database
        run: |
          psql "${{ secrets.SUPABASE_DB_CONNECTION_STRING }}" -c "SELECT 1;"
